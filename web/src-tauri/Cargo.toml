[package]
name = "orbyn-notes"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Orbyn Notes local Windows shell"
license = "PolyForm-Strict-1.0.0"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-single-instance = { version = "=2.5.5", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[dev-dependencies]
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
