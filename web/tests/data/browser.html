<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Notes synthetic storage qualification</title>
  <body>
    Test fixture only
    <script type="module">
      import { loadEngine, DeviceKeys } from "/src/data/engine.ts";
      import {
        newWrappingKey,
        wrappingSecret,
        mutateRecord,
        readRecord,
      } from "/src/data/database.ts";
      import { establish, lock, onLock } from "/src/account/session.ts";
      import { openNotesStore } from "/src/data/index.ts";
      const identity = {
        accountId: "11111111-1111-4111-8111-111111111111",
        deviceId: "22222222-2222-4222-8222-222222222222",
        email: "browser-fixture@example.test",
        deviceState: "trusted",
      };
      let store;
      let locked = false;
      let changes = 0;
      onLock(() => {
        locked = true;
      });
      window.fixture = {
        async seed() {
          await loadEngine();
          const wrapKey = await newWrappingKey();
          const secret = await wrappingSecret(wrapKey);
          const keys = DeviceKeys.create();
          try {
            await mutateRecord("devices", identity.email, () => ({
              ...identity,
              wrapKey,
              sealedKeys: keys.export(secret),
              generation: 0,
            }));
          } finally {
            keys.free();
            secret.fill(0);
          }
        },
        async open() {
          await loadEngine();
          establish(identity);
          locked = false;
          store = await openNotesStore(identity);
          store.subscribe(() => changes++);
        },
        create() {
          return store.create({
            title: "Browser synthetic secret",
            document: {
              type: "doc",
              content: [
                {
                  type: "paragraph",
                  content: [{ type: "text", text: "Never plaintext" }],
                },
              ],
            },
            tags: ["browser"],
          });
        },
        list() {
          return store.list();
        },
        update(id, title, revision) {
          return store.update(id, { title }, revision).then(
            (note) => ({ ok: true, note }),
            (error) => ({
              ok: false,
              code: error.code,
              current: error.current,
              attempted: error.attempted,
            }),
          );
        },
        async inspect() {
          const record = await readRecord("devices", identity.email);
          return {
            extractable: record.wrapKey.extractable,
            plaintext: new TextDecoder()
              .decode(record.snapshot)
              .includes("Browser synthetic secret"),
            keys: Object.keys(record),
            snapshotBytes: record.snapshot.length,
          };
        },
        lock() {
          lock();
        },
        state() {
          return { locked, changes };
        },
      };
    </script>
  </body>
</html>
