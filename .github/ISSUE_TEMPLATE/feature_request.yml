name: Feature request
description: Something Orbyn Notes should do that it does not do yet.
title: "feat: "
labels:
  - enhancement
  - needs triage
body:
  - type: markdown
    attributes:
      value: "Title as `feat(scope): what it should do`. Keep it short. Orbyn Notes follows a product plan and designs; a request is weighed against them, and new screens are designed before they are built."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead. Describe behaviour, not code.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Editor and pages
        - Library and search
        - Links to Orbyn Planner
        - Study
        - Clip
        - Journal
        - Sync and devices
        - Settings
        - Phone
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: ai-used
    attributes:
      label: AI usage
      options:
        - Human only
        - AI helped
    validations:
      required: true
  - type: input
    id: ai-details
    attributes:
      label: AI details
      description: If AI helped, the harness and version, each model by exact ID and what it did, and the effort.
