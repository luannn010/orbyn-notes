name: Web
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    # Local runner only when the repository variable CI_RUNNER is 'local', the pull request is not from a fork and the actor is not Dependabot. A pull request can still edit this expression for its own run: the real controls are the runner group's repository access and the fork approval policy.
    runs-on: ${{ (vars.CI_RUNNER == 'local' && github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]') && fromJSON('["self-hosted","orbyn-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: node scripts/verify-engine.mjs
      - name: Test engine build provenance
        run: node --test scripts/engine-source.test.mjs
      - name: Check foundation
        if: hashFiles('web/index.html') == ''
        run: npm run check:data
      - name: Test foundation
        if: hashFiles('web/index.html') == ''
        run: npm run test:data
      - name: Check application
        if: hashFiles('web/index.html') != ''
        run: npm run check
      - name: Test application
        if: hashFiles('web/index.html') != ''
        run: npm test
      - name: Build application
        if: hashFiles('web/index.html') != ''
        run: npm run build
