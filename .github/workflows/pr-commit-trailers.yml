name: Commit trailers
# Fails a pull request when any of its commit messages carries an AI attribution trailer: a
# Co-Authored-By naming an AI tool, or a "Generated with" line. AI use is disclosed in the pull
# request's AI usage section instead. It reads commit messages through the API and checks out
# only `scripts/`, never the rest of the pull request.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  commit-trailers:
    name: Commit trailers
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    # Local runner only when the repository variable CI_RUNNER is 'local', the pull request is not from a fork and the actor is not Dependabot. A pull request can still edit this expression for its own run: the real controls are the runner group's repository access and the fork approval policy.
    runs-on: ${{ (vars.CI_RUNNER == 'local' && github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]') && fromJSON('["self-hosted","orbyn-local"]') || 'ubuntu-24.04' }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Check the checker
        run: python3 scripts/test_check_commit_trailers.py
      - name: Check the commit messages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PULL: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PULL/commits" \
            --jq '.[] | {sha: .sha, message: .commit.message}' > commits.jsonl
          python3 scripts/check_commit_trailers.py commits.jsonl
